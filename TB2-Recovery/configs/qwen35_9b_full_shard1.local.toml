[experiment]
output_dir = "TB2-Recovery/runs/qwen35_9b_full_shard1"
k_values = [1, 2, 3]

[benchmark]
name = "tb2"
import_path = "tb2_recovery.adapter:build_benchmark"

[benchmark.options]
dataset_path = "/data/xiewei/Recovery-Bench/external/terminal-bench-2"
project_root = "/data/xiewei/Recovery-Bench/TB2-Recovery"
harbor_bin = "/home/xiewei/.local/bin/harbor"
success_threshold = 1.0
cleanup_recovery_images = true
state_backend = "docker_commit"

[benchmark.options.local_optimization]
enabled = true
prebake_images = true
mutate_original_images = false
pull_missing_images = true
docker_mirror_prefix = "docker.1panel.live"
docker_pull_retries = 3
docker_pull_total_timeout_sec = 1800
optimized_image_prefix = "tb2-local-opt"
prebake_script = "/data/xiewei/Recovery-Bench/TB2-Recovery/scripts/prebake_task_image.sh"

[benchmark.options.container_proxy]
enabled = true
http_proxy = "http://172.17.0.1:17890"
https_proxy = "http://172.17.0.1:17890"
no_proxy = "localhost,127.0.0.1,172.17.0.1,172.17.0.0/16"

[agent]
name = "terminus-2"
import_path = "tb2_recovery.adapter:build_agent"

[agent.options]
api_base = "http://172.17.0.1:18081/v1"
openai_api_key = "EMPTY"
memory_max_chars = 0
max_tokens = 8192

[agent.options.model_info]
max_input_tokens = 120832
max_output_tokens = 8192
input_cost_per_token = 0.0
output_cost_per_token = 0.0

[model]
name = "openai/Qwen3.5-9B"
provider = "litellm"
