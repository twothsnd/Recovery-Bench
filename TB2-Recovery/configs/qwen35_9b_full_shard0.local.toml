[experiment]
output_dir = "TB2-Recovery/runs/qwen35_9b_full_shard0"
k_values = [1, 2, 3]

[benchmark]
name = "tb2"
import_path = "tb2_recovery.adapter:build_benchmark"

[benchmark.options]
dataset_path = "/data/xiewei/Recovery-Bench/external/terminal-bench-2"
project_root = "/data/xiewei/Recovery-Bench/TB2-Recovery"
harbor_bin = "/home/xiewei/.local/bin/harbor"
success_threshold = 1.0
cleanup_recovery_images = true
state_backend = "docker_commit"

[benchmark.options.local_optimization]
enabled = true
build_wheelhouse = false
mount_wheelhouse = true
require_wheelhouse = false
prebake_images = true
mutate_original_images = false
pull_missing_images = true
docker_mirror_prefix = "docker.1panel.live"
docker_pull_retries = 3
docker_pull_total_timeout_sec = 1800
optimized_image_prefix = "tb2-local-opt"
wheelhouse_path = "/data/xiewei/Recovery-Bench/TB2-Recovery/wheelhouse"
wheelhouse_container_path = "/opt/tb2/wheelhouse"
build_wheelhouse_script = "/data/xiewei/Recovery-Bench/TB2-Recovery/scripts/build_wheelhouse.sh"
prebake_script = "/data/xiewei/Recovery-Bench/TB2-Recovery/scripts/prebake_task_image.sh"

[benchmark.options.local_optimization.env]
PIP_INDEX_URL = "https://mirrors.aliyun.com/pypi/simple/"
PIP_TRUSTED_HOST = "mirrors.aliyun.com"
UV_INDEX_URL = "https://mirrors.aliyun.com/pypi/simple/"
GH_PROXY = "https://gh-proxy.com"
TB2_WHEELHOUSE_HEAVY = "0"
TB2_LOCAL_PKG_DELAY_SEC = "5"
TB2_PREBAKE_MINI_SWE_AGENT = "0"

[agent]
name = "terminus-2"
import_path = "tb2_recovery.adapter:build_agent"

[agent.options]
api_base = "http://172.17.0.1:18080/v1"
openai_api_key = "EMPTY"
memory_max_chars = 0
override_timeout_sec = 900
max_timeout_sec = 900
override_verifier_timeout_sec = 900
max_verifier_timeout_sec = 900
override_setup_timeout_sec = 900
max_tokens = 12288
dynamic_max_tokens = true
output_token_safety_margin = 2048

[agent.options.model_info]
max_input_tokens = 131072
input_cost_per_token = 0.0
output_cost_per_token = 0.0

[model]
name = "openai/Qwen3.5-9B"
provider = "litellm"
