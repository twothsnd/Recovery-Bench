[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recovery-bench"
version = "0.1.0"
description = "Stateful retry and recovery evaluation framework for agent benchmarks"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
recovery-bench = "recovery_bench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
