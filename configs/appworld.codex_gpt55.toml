[experiment]
output_dir = "runs/appworld-gpt-5.5"
k_values = [1, 2, 3]
task_ids = []

[benchmark]
name = "appworld"

[benchmark.options]
source_path = "external/appworld/runtime"
dataset_name = "test_challenge"
experiment_name = "recovery-bench"

[agent]
name = "openai-agent"

[agent.options]
max_steps = 50

[model]
name = "gpt-5.5"
provider = "openai"

[model.options]
codex_provider = "custom"
max_output_tokens = 8192
request_retries = 2
retry_backoff_seconds = 20
empty_response_retries = 2

[model.options.reasoning]
effort = "medium"
