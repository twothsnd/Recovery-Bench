[experiment]
output_dir = "runs/enterpriseops-gym-gpt-5.5"
k_values = [1, 2, 3]
task_ids = []

[benchmark]
name = "enterpriseops-gym"

[benchmark.options]
source_path = "external/enterpriseops-gym/src"
hf_dataset = "ServiceNow-AI/EnterpriseOps-Gym"
domain = "teams"
mode = "oracle"
configs_folder = "external/enterpriseops-gym/tasks/oracle/teams"
auto_unzip_dbs = true

# Optional when local ports differ from EnterpriseOps-Gym's defaults.
# [benchmark.options.mcp_server_url_overrides]
# csm = "http://localhost:8011"

[agent]
name = "openai-agent"

[agent.options]
max_steps = 50

[model]
name = "gpt-5.5"
provider = "openai"

[model.options]
codex_provider = "custom"
max_output_tokens = 8192
request_retries = 2
retry_backoff_seconds = 20
empty_response_retries = 2

[model.options.reasoning]
effort = "medium"
