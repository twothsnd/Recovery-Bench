[experiment]
output_dir = "runs/enterpriseops-gym-gpt-4.1"
k_values = [1, 2, 3]
task_ids = []

[benchmark]
name = "enterpriseops-gym"

[benchmark.options]
# Official source checkout downloaded with scripts/download_benchmark_archive.sh.
source_path = "external/enterpriseops-gym/src"
hf_dataset = "ServiceNow-AI/EnterpriseOps-Gym"
domain = "teams"
mode = "oracle"

# Prefer a local materialized config folder for reproducible runs.
# If omitted, the adapter attempts to load the official Hugging Face dataset
# through the datasets package.
configs_folder = "external/enterpriseops-gym/tasks/oracle/teams"

# Optional when local ports differ from EnterpriseOps-Gym's defaults.
# [benchmark.options.mcp_server_url_overrides]
# csm = "http://localhost:8011"

# The adapter unpacks official gym_dbs.zip to external/enterpriseops-gym/data
# on first reset unless this is set to false.
auto_unzip_dbs = true

[agent]
name = "openai-agent"

[agent.options]
max_steps = 50

[model]
name = "gpt-4.1"
provider = "openai"

[model.options]
temperature = 0
